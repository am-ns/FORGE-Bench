name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Compile check Python sources
        run: |
          find eval/ scoring/ scripts/ -name '*.py' -exec python -m py_compile {} +
          python -m py_compile dataset/validate.py
